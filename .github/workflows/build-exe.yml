name: Release exe

# 打 tag（v1.1.0 这种）时自动打包 exe 并传进对应的 Release。
# 也可以手动触发：Actions → Release exe → Run workflow（只产出 artifact，不发布）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装打包依赖
        run: python -m pip install --upgrade pip pyinstaller pillow

      - name: 打包单文件 exe
        run: python build_exe.py

      - name: 冒烟测试（版本号 + 离线自检）
        run: |
          dist\LeigodAutoPause.exe --version
          dist\LeigodAutoPause.exe selftest

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: LeigodAutoPause-exe
          path: dist/LeigodAutoPause.exe

      - name: 附到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LeigodAutoPause.exe
          fail_on_unmatched_files: true
