name: Release exe

# 打 tag（v1.1.0 这种）时自动打包 exe 并传进对应的 Release。
# 也可以手动触发：Actions → Release exe → Run workflow（只产出 artifact，不发布）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest
    steps:
      # actions 一律按 commit SHA 固定，避免 tag 被移动后执行到别人的代码
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: 安装打包依赖
        run: python -m pip install "pyinstaller==6.22.3" "pillow==13.0.0"

      - name: 打包单文件 exe
        run: python build_exe.py

      - name: 打包便携版（onedir，免解压）
        run: python build_exe.py --onedir

      - name: 冒烟测试（两个版本都测：版本号 + 离线自检）
        run: |
          dist\LeigodAutoPause.exe --version
          dist\LeigodAutoPause.exe selftest
          dist\LeigodAutoPause\LeigodAutoPause.exe --version
          dist\LeigodAutoPause\LeigodAutoPause.exe selftest

      # 配了证书才签：没配就跳过，构建照常出未签名 exe（README 有说明为什么）
      - name: 可选代码签名
        shell: pwsh
        env:
          CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          CODE_SIGN_PFX_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
        run: |
          ./scripts/sign_exe.ps1 -Path dist\LeigodAutoPause.exe
          ./scripts/sign_exe.ps1 -Path dist\LeigodAutoPause\LeigodAutoPause.exe
          # 签名会改文件内容，压缩包要在签名之后重新打
          Remove-Item dist\LeigodAutoPause-portable.zip -ErrorAction SilentlyContinue
          Compress-Archive -Path dist\LeigodAutoPause -DestinationPath dist\LeigodAutoPause-portable.zip -Force

      - name: 生成 SHA256SUMS 并核对 exe 自报的哈希
        shell: pwsh
        run: |
          $exe = "dist\LeigodAutoPause.exe"
          $zip = "dist\LeigodAutoPause-portable.zip"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash
          # 注意：别写成 @("a" -f $x, "b" -f $y) | Set-Content —— 逗号会和 -f 抢参数，
          # 结果只写进第一行（v1.3.2 踩过）。逐行 += 最稳。
          $lines = @()
          $lines += "{0}  LeigodAutoPause.exe" -f $hash
          $lines += "{0}  LeigodAutoPause-portable.zip" -f $zipHash
          $lines | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          $self = (& $exe checksum).Trim()
          if ($self -ne $hash) { throw "exe 自报 $self 与文件哈希 $hash 不一致" }
          "OK：exe 自报哈希与文件一致"

      - name: 上传构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: LeigodAutoPause-exe
          path: |
            dist/LeigodAutoPause.exe
            dist/LeigodAutoPause-portable.zip
            SHA256SUMS.txt

      - name: 附到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            dist/LeigodAutoPause.exe
            dist/LeigodAutoPause-portable.zip
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          name: "${{ github.ref_name }} — 雷神加速器挂机自动暂停"
          body: |
            ## 两个版本，选一个

            | 下载 | 适合 | 启动 / status |
            |---|---|---|
            | **LeigodAutoPause.exe**（单文件，8 MB） | 最省事，双击就用 | ~0.7 s / ~1.0 s |
            | **LeigodAutoPause-portable.zip**（便携版） | 想要更快、不想每次解压到临时目录 | ~0.1 s / ~0.4 s |

            单文件版：放到任意有写权限的目录，双击，按 `1`。
            便携版：解压到自己的目录，双击里面的 `LeigodAutoPause.exe`，按 `1`。两者功能完全一样。

            > 首次运行若提示「已保护你的电脑」：点 **更多信息 → 仍要运行**。个人项目没有商业代码签名（证书要钱/要组织资质），代码全部开源在本仓库。

            ## 校验下载（重要）

            本页附了 `SHA256SUMS.txt`。下载后核对一下，能确认文件**完整、没被截断/传坏**。它和产物同源，**挡不住「两者一起被换」**，也不提供身份认证 —— 安全边界见 [SECURITY.md](https://github.com/lyxcll/leigod-autopause/blob/main/SECURITY.md)。

            ```powershell
            (Get-FileHash .\LeigodAutoPause.exe -Algorithm SHA256).Hash
            # 与 SHA256SUMS.txt 里的那一串逐字符对比
            .\LeigodAutoPause.exe checksum   # exe 自己算一遍，输出同样的哈希
            ```

            从旧版升级：新 exe 直接覆盖旧的即可，`config.json` 会自动补齐新字段；已装自启的，双击新版按 `1` 重装一次。

            各版本改动见 [CHANGELOG.md](https://github.com/lyxcll/leigod-autopause/blob/main/CHANGELOG.md)。
