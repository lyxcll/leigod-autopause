name: Release exe

# 打 tag（v1.1.0 这种）时自动打包 exe 并传进对应的 Release。
# 也可以手动触发：Actions → Release exe → Run workflow（只产出 artifact，不发布）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装打包依赖
        run: python -m pip install --upgrade pip pyinstaller pillow

      - name: 打包单文件 exe
        run: python build_exe.py

      - name: 冒烟测试（版本号 + 离线自检）
        run: |
          dist\LeigodAutoPause.exe --version
          dist\LeigodAutoPause.exe selftest

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: LeigodAutoPause-exe
          path: dist/LeigodAutoPause.exe

      - name: 附到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LeigodAutoPause.exe
          fail_on_unmatched_files: true
          name: "${{ github.ref_name }} — 雷神加速器挂机自动暂停（单文件 exe）"
          body: |
            ## 下载即用（免 Python）

            **LeigodAutoPause.exe**（单文件）—— 放到任意有写权限的目录，双击，按 `1`。

            > 首次运行若提示「已保护你的电脑」：点 **更多信息 → 仍要运行**。个人项目无代码签名，代码全部开源在本仓库。

            从旧版升级：新 exe 直接覆盖旧的即可，`config.json` 会自动补齐新字段；已装自启的，双击新版按 `1` 重装一次。

            各版本改动见 [CHANGELOG.md](https://github.com/lyxcll/leigod-autopause/blob/main/CHANGELOG.md)。
