name: optional-daily-pause

# 可选：每天北京时间 01:00 自动暂停一次（云端兜底）。
# 不需要就禁用这个 workflow，或者直接删掉本文件。
on:
  schedule:
    - cron: "0 17 * * *" # UTC 17:00 = 北京时间次日 01:00
  workflow_dispatch:

permissions:
  contents: read   # 只发一个 HTTPS 请求，不需要写仓库

jobs:
  pause:
    runs-on: ubuntu-latest
    steps:
      - name: 调用雷神 pause 接口
        env:
          LEIGOD_TOKEN: ${{ secrets.LEIGOD_TOKEN }}
        run: |
          set -u
          if [ -z "${LEIGOD_TOKEN:-}" ]; then
            echo "::error::没有配置 secrets.LEIGOD_TOKEN"
            exit 1
          fi

          body="{\"account_token\":\"${LEIGOD_TOKEN}\",\"lang\":\"zh_CN\"}"
          # 用 stdin 传 body：token 不出现在进程命令行里（同机 ps 看不到）
          resp=$(printf '%s' "$body" | curl -sS --max-time 30 -X POST \
            "https://webapi.leigod.com/api/user/pause" \
            -H "Content-Type: application/json" \
            -H "User-Agent: leigod/11.3.3.2" \
            --data @-)

          # 响应里可能带账号标识：打印前先脱敏，别把整包原样贴进公开的 Actions 日志
          safe=$(printf '%s' "$resp" | sed -E 's/(account_token"?[:=]"?)[^",&}]+/\1***/g')
          echo "$safe" | iconv -f gbk -t utf-8 2>/dev/null || echo "$safe"

          code=$(printf '%s' "$resp" | sed -n 's/.*"code":\([-0-9]*\).*/\1/p')
          echo "code=${code:-unknown}"
          case "${code:-}" in
            0 | 400803) echo "✅ 已暂停（400803 表示本来就已暂停）" ;;
            *)
              echo "::error::暂停失败"
              exit 1
              ;;
          esac
